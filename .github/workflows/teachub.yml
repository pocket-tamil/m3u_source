name: Update Teachub M3U

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download latest playlist
        run: |
          curl -L "curl -L "https://thanks-to-veer.saqlainhaider8198.workers.dev/jtvplus.m3u%5Bskplus%5D?ua=sktechtv" -o teachub.m3u

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add teachub.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update teachub.m3u"
            git pull --rebase origin main
            git push
          fi
